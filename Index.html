<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAP DRM Digital Management System</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#F0F9FF',
              100: '#E0F2FE',
              500: '#0284C7',
              600: '#0369A1',
              700: '#075985',
              900: '#0C4A6E',
            },
            accent: {
              cyan: '#06B6D4',
              teal: '#0D9488',
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .tabular-nums { font-variant-numeric: tabular-nums; }
    /* Subtle custom scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #F1F5F9; }
    ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94A3B8; }
    .glass-header {
      backdrop-filter: blur(12px);
      background-color: rgba(255, 255, 255, 0.88);
    }
    .dark .glass-header {
      background-color: rgba(15, 23, 42, 0.88);
    }
  </style>
</head>
<body class="bg-[#F4F7FA] dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col antialiased">
  
  <!-- TOP BAR CONTRACT: [Brand, 1 line] — [Nav links, single line] — [1 Primary Action] -->
  <header class="glass-header sticky top-0 z-40 border-b border-slate-200/80 dark:border-slate-800 px-6 py-3 flex items-center justify-between gap-8 transition-colors">
    <div class="flex items-center gap-3 shrink-0">
      <div class="w-9 h-9 rounded-lg bg-gradient-to-tr from-sky-600 to-teal-500 flex items-center justify-center text-white shadow-xs font-bold text-sm tracking-wider">
        DRM
      </div>
      <div class="flex flex-col">
        <span class="text-base font-bold tracking-tight text-slate-900 dark:text-white whitespace-nowrap">SAP DRM Digital System</span>
        <span class="text-[11px] text-slate-500 dark:text-slate-400 font-medium whitespace-nowrap">Automotive Manufacturing Operations</span>
      </div>
    </div>

    <!-- Middle Info & Controls -->
    <div class="hidden lg:flex items-center gap-4 text-xs">
      <div class="flex items-center gap-2 bg-slate-100 dark:bg-slate-900 px-3 py-1.5 rounded-lg border border-slate-200/60 dark:border-slate-800">
        <span class="text-slate-500 dark:text-slate-400">Financial Year:</span>
        <select id="globalFySelect" onchange="window.app.handleFyChange(this.value)" class="bg-transparent font-semibold text-slate-800 dark:text-slate-200 focus:outline-hidden cursor-pointer">
          <option value="FY 2026-2027">FY 2026–2027</option>
          <option value="FY 2025-2026">FY 2025–2026</option>
          <option value="FY 2024-2025">FY 2024–2025</option>
        </select>
      </div>

      <div class="flex items-center gap-2 bg-slate-100 dark:bg-slate-900 px-3 py-1.5 rounded-lg border border-slate-200/60 dark:border-slate-800">
        <span class="text-slate-500 dark:text-slate-400">Role:</span>
        <select id="roleSwitcher" onchange="window.app.switchRole(this.value)" class="bg-transparent font-semibold text-sky-600 dark:text-sky-400 focus:outline-hidden cursor-pointer">
          <option value="ADMIN">Administrator (Full Control)</option>
          <option value="DEPT_HEAD">Dept Head (Approvals & Reviews)</option>
          <option value="DEPT_USER">Dept User (Actuals & Upload)</option>
        </select>
      </div>

      <div class="flex items-center gap-2 text-slate-500 dark:text-slate-400">
        <i data-lucide="shield-check" class="w-4 h-4 text-teal-500"></i>
        <span id="userEmailBadge" class="tabular-nums">admin@company.com</span>
      </div>
    </div>

    <!-- Top Action Zone -->
    <div class="flex items-center gap-3 shrink-0">
      <button onclick="window.app.toggleDarkMode()" class="p-2 rounded-lg text-slate-500 hover:text-slate-900 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors" title="Toggle Theme">
        <i data-lucide="moon" class="w-4 h-4 dark:hidden"></i>
        <i data-lucide="sun" class="w-4 h-4 hidden dark:block"></i>
      </button>
      <button onclick="window.app.openGasDeployModal()" class="px-3.5 py-1.5 text-xs font-semibold text-white bg-slate-900 dark:bg-sky-600 hover:bg-slate-800 dark:hover:bg-sky-500 rounded-lg transition-colors shadow-xs flex items-center gap-2 whitespace-nowrap shrink-0">
        <i data-lucide="cloud-upload" class="w-4 h-4"></i>
        <span>GAS Setup & Deploy</span>
      </button>
    </div>
  </header>

  <!-- MAIN WRAPPER: Sidebar + Content -->
  <div class="flex flex-1 overflow-hidden">
    <!-- COLLAPSIBLE SIDEBAR -->
    <aside id="mainSidebar" class="w-64 bg-white dark:bg-slate-900 border-r border-slate-200/80 dark:border-slate-800 flex flex-col shrink-0 transition-all duration-200">
      <div class="p-4 border-b border-slate-100 dark:border-slate-800 flex items-center justify-between">
        <span class="text-xs font-semibold text-slate-400 tracking-wider">NAVIGATION</span>
        <button onclick="window.app.toggleSidebar()" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
          <i data-lucide="panel-left-close" class="w-4 h-4"></i>
        </button>
      </div>

      <nav class="flex-1 p-3 space-y-1 overflow-y-auto text-xs font-medium">
        <button onclick="window.app.navigate('dashboard')" class="nav-item w-full flex items-center gap-3 px-3 py-2 rounded-lg text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors" data-view="dashboard">
          <i data-lucide="layout-dashboard" class="w-4 h-4 text-sky-600"></i>
          <span>Executive Dashboard</span>
        </button>
        <button onclick="window.app.navigate('indicators')" class="nav-item w-full flex items-center gap-3 px-3 py-2 rounded-lg text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors" data-view="indicators">
          <i data-lucide="list-checks" class="w-4 h-4 text-teal-600"></i>
          <span>DRM Indicator Register</span>
        </button>
        <button onclick="window.app.navigate('monthly')" class="nav-item w-full flex items-center gap-3 px-3 py-2 rounded-lg text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors" data-view="monthly">
          <i data-lucide="calendar" class="w-4 h-4 text-blue-600"></i>
          <span>Monthly Tracking</span>
        </button>
        <button onclick="window.app.navigate('sap_upload')" class="nav-item w-full flex items-center gap-3 px-3 py-2 rounded-lg text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors" data-view="sap_upload">
          <i data-lucide="file-up" class="w-4 h-4 text-cyan-600"></i>
          <span>SAP Data Import</span>
        </button>
        <button onclick="window.app.navigate('approvals')" class="nav-item w-full flex items-center gap-3 px-3 py-2 rounded-lg text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors" data-view="approvals">
          <i data-lucide="check-square" class="w-4 h-4 text-emerald-600"></i>
          <span>Approval Center</span>
        </button>
        <button onclick="window.app.navigate('corrective_actions')" class="nav-item w-full flex items-center gap-3 px-3 py-2 rounded-lg text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors" data-view="corrective_actions">
          <i data-lucide="alert-triangle" class="w-4 h-4 text-amber-600"></i>
          <span>Corrective Actions (CAPA)</span>
        </button>
        <button onclick="window.app.navigate('departments')" class="nav-item w-full flex items-center gap-3 px-3 py-2 rounded-lg text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors" data-view="departments">
          <i data-lucide="building-2" class="w-4 h-4 text-indigo-600"></i>
          <span>Departments</span>
        </button>
        <button onclick="window.app.navigate('reports')" class="nav-item w-full flex items-center gap-3 px-3 py-2 rounded-lg text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors" data-view="reports">
          <i data-lucide="file-spreadsheet" class="w-4 h-4 text-slate-600"></i>
          <span>Reports & Exports</span>
        </button>
        <button onclick="window.app.navigate('historical')" class="nav-item w-full flex items-center gap-3 px-3 py-2 rounded-lg text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors" data-view="historical">
          <i data-lucide="history" class="w-4 h-4 text-violet-600"></i>
          <span>Historical Analytics</span>
        </button>
        <button onclick="window.app.navigate('audit')" class="nav-item w-full flex items-center gap-3 px-3 py-2 rounded-lg text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors" data-view="audit">
          <i data-lucide="clipboard-list" class="w-4 h-4 text-rose-600"></i>
          <span>Audit Logs</span>
        </button>
        <button onclick="window.app.navigate('settings')" class="nav-item w-full flex items-center gap-3 px-3 py-2 rounded-lg text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors" data-view="settings">
          <i data-lucide="settings" class="w-4 h-4 text-slate-600"></i>
          <span>Application Settings</span>
        </button>
      </nav>

      <!-- Sidebar Footer: Storage Info -->
      <div class="p-3 border-t border-slate-100 dark:border-slate-800 text-[11px] text-slate-500 dark:text-slate-400">
        <div class="flex items-center justify-between mb-1">
          <span class="font-medium">Drive Storage</span>
          <span class="text-teal-600 font-semibold">SAP_DRM_Data</span>
        </div>
        <p class="text-[10px] text-slate-400 leading-tight">Enterprise automotive standard IATF 16949 / ISO 9001 compliance engine</p>
      </div>
    </aside>

    <!-- CONTENT VIEWPORT -->
    <main class="flex-1 overflow-y-auto p-6 md:p-8 space-y-6" id="mainContainer">
      <!-- Dynamic Views rendered here via JavaScript -->
      <div id="viewMount"></div>
    </main>
  </div>

  <!-- TOAST CONTAINER -->
  <div id="toastContainer" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <!-- GOOGLE APPS SCRIPT CLIENT LOGIC & LOCAL PERSISTENCE ENGINE -->

     * SAP DRM Client & Standalone Google Apps Script Integration
     */

        calculateCompliance: function(rule, actual, target, tolMin, tolMax) {
          if (actual === null || actual === undefined || isNaN(actual)) {
            return { status: 'Not Reported', achievementPct: null, variance: null };
          }
          actual = Number(actual);
          target = Number(target);
          let variance = +(actual - target).toFixed(2);
          let achievementPct = null;
          let status = 'Non-Compliant';

          if (rule === 'HIGHER_IS_BETTER') {
            if (target !== 0) achievementPct = +((actual / target) * 100).toFixed(1);
            if (actual >= target) status = 'Compliant';
            else if (tolMin !== undefined && actual >= tolMin) status = 'Action Required';
            else status = 'Non-Compliant';
          } else if (rule === 'LOWER_IS_BETTER') {
            if (target !== 0) achievementPct = +((target / actual) * 100).toFixed(1);
            variance = +(target - actual).toFixed(2);
            if (actual <= target) status = 'Compliant';
            else if (tolMax !== undefined && actual <= tolMax) status = 'Action Required';
            else status = 'Non-Compliant';
          } else if (rule === 'EQUAL_TO_TARGET') {
            if (actual === target) { status = 'Compliant'; achievementPct = 100.0; }
            else { status = 'Non-Compliant'; achievementPct = 0.0; }
          } else if (rule === 'WITHIN_RANGE') {
            if (actual >= tolMin && actual <= tolMax) {
              status = 'Compliant';
              achievementPct = 100.0;
            } else {
              status = 'Non-Compliant';
              achievementPct = Math.max(0, 100 - Math.abs(actual - target));
            }
          }
          return { status, achievementPct, variance };
        },

        exportCapaCsv: function() {
          let csv = 'Action_ID,Indicator_ID,Department,Problem,Root_Cause,Corrective_Action,Owner,Status,Due_Date\n';
          this.state.correctiveActions.forEach(c => {
            csv += `"${c.actionId}","${c.indicatorId}","${c.departmentId}","${c.problemDescription}","${c.rootCause}","${c.correctiveAction}","${c.assignedOwner}","${c.status}","${c.dueDate}"\n`;
          });
          const blob = new Blob([csv], { type: 'text/csv' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'SAP_DRM_CAPA_Log.csv';
          a.click();
          this.showToast('CAPA report CSV downloaded', 'success');
        },

        showToast: function(message, type = 'info') {
          const container = document.getElementById('toastContainer');
          if (!container) return;
          const toast = document.createElement('div');
          const bg = type === 'success' ? 'bg-teal-600' : type === 'error' ? 'bg-rose-600' : 'bg-slate-900';
          toast.className = `${bg} text-white text-xs px-4 py-2.5 rounded-lg shadow-lg flex items-center gap-2 transform transition-all duration-200 pointer-events-auto`;
          toast.innerHTML = `<span>${message}</span>`;
          container.appendChild(toast);
          setTimeout(() => {
            toast.style.opacity = '0';
            setTimeout(() => toast.remove(), 200);
          }, 3000);
        },

        bindEvents: function() {
          // Event delegation if needed
        }
      };

      // Auto start
      document.addEventListener('DOMContentLoaded', () => {
        window.app.init();
      });
    })();
  </script>
</body>
</html>
